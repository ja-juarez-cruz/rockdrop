name: Deploy Dev

on:
  push:
    branches: [dev]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.7.0

jobs:
  deploy:
    name: Deploy to jajc_dev (116921840630)
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID_DEV }}:role/rockdrop-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify identity
        run: aws sts get-caller-identity

      # ── Lambda layer ────────────────────────────────────────────────────────

      - name: Build common layer
        run: |
          pip3 install -r lambdas/layers/requirements.txt -t lambdas/layers/common/python/ --quiet \
            --platform manylinux2014_x86_64 --only-binary=:all: --python-version 3.12
          cp lambdas/layers/src/*.py lambdas/layers/common/python/

      # ── Infraestructura ─────────────────────────────────────────────────────

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: infra
        run: terraform init -backend-config=backends/dev.hcl -reconfigure

      - name: Terraform Validate
        working-directory: infra
        run: terraform validate

      - name: Terraform Plan
        working-directory: infra
        run: terraform plan -var-file=envs/dev.tfvars -out=tfplan

      - name: Terraform Apply
        working-directory: infra
        run: terraform apply -auto-approve tfplan
